<form
    name="kontakt"
    method="POST"
    data-netlify="true"
>
    <label for="name">Namn</label>
    <input
        id="name"
        name="name"
        type="text"
        required
    >

    <label for="email">E-post</label>
    <input
        id="email"
        name="email"
        type="email"
        required
    >

    <label for="message">Meddelande</label>
    <textarea
        id="message"
        name="message"
        required
    ></textarea>

    <button type="submit">
        Skicka
    </button>
</form>
